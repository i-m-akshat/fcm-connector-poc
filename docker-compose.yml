version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fcmpoc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ./src/FirebaseConnector
      dockerfile: Dockerfile
    container_name: fcmpoc-api
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      - redis
    env_file:
      - .env
    volumes:
      - ./secrets:/app/secrets:ro
    restart: unless-stopped
